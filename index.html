<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>生日快乐</title>
<style>
  /* ============ 主题变量 ============ */
  :root{
    --night-1:#080c18;
    --night-2:#121a33;
    --night-3:#1b2547;
    --gold:#d8b26a;
    --gold-soft:#e9cd97;
    --gold-deep:#a9832f;
    --paper:#fdf7ea;
    --paper-2:#f6ecd8;
    --ink:#3a3227;
    --ink-soft:#6a5d4c;
    --seal:#a8324a;
    --serif: Georgia, "Times New Roman", "Songti SC", "Noto Serif SC", "SimSun", serif;
    --hand: "STXingkai", "华文行楷", "Xingkai SC", "Kaiti SC", "STKaiti", "KaiTi", "楷体", cursive;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:var(--sans);
    color:#f4ead6;
    background:
      radial-gradient(1200px 700px at 15% 0%, #22305c 0%, transparent 60%),
      radial-gradient(900px 600px at 90% 100%, #2a2140 0%, transparent 55%),
      linear-gradient(160deg, var(--night-2) 0%, var(--night-1) 55%, #060911 100%);
    overflow:hidden;
    transition:background .9s ease;
  }
  body.is-open{
    background:
      radial-gradient(1000px 620px at 50% -10%, #2b3866 0%, transparent 62%),
      radial-gradient(900px 600px at 85% 110%, #33253f 0%, transparent 55%),
      linear-gradient(160deg, #131b34 0%, #0a0f1e 60%, #070a13 100%);
  }

  /* 星尘（卡片背后） / 彩带（卡片之上） */
  #fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
  #fx2{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:6; }

  /* 顶部柔光 */
  .glow{
    position:fixed; left:50%; top:-18vmin; width:120vmin; height:60vmin; transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(216,178,106,.20), transparent 70%);
    filter:blur(10px); pointer-events:none; z-index:0;
  }

  .stage{
    position:relative; z-index:2;
    min-height:100vh; min-height:100svh; min-height:100dvh;
    display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:1fr;
    align-items:center; justify-items:center;
    padding:max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
  }
  .envelope-wrap, .card{ grid-area:1 / 1; }

  /* ================= 信封 ================= */
  .envelope-wrap{
    display:grid; justify-items:center; gap:26px;
    max-width:100%;
    transition:opacity .55s ease, transform .55s ease;
  }
  .envelope-wrap.gone{ opacity:0; transform:scale(.92); pointer-events:none; transition:opacity .26s ease, transform .26s ease; }

  .envelope{
    position:relative;
    width:clamp(258px, 74vw, 392px);
    aspect-ratio:1.46 / 1;
    cursor:pointer;
    perspective:1500px;
    transform:translateZ(0);
    filter:drop-shadow(0 26px 42px rgba(0,0,0,.55));
    animation:float 6.5s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform:translateY(0) rotate(-.35deg); }
    50%{ transform:translateY(-7px) rotate(.35deg); }
  }
  .envelope:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:10px; border-radius:14px; }

  .env-back, .env-letter, .env-front, .env-flap{ position:absolute; inset:0; }
  .env-back{
    border-radius:0 0 12px 12px;
    background:linear-gradient(158deg, #f9edd7 0%, #eedcb9 52%, #e0c79d 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.6), inset 0 -16px 26px rgba(150,115,60,.14);
  }

  .env-letter{
    z-index:2; left:6%; right:6%; top:4%; height:92%;
    border-radius:8px 8px 3px 3px;
    background:linear-gradient(180deg, #fffdf6, var(--paper) 70%, #f4e8d1);
    box-shadow:0 -2px 10px rgba(90,60,20,.16);
    transform:translateY(0);
    transition:transform .75s cubic-bezier(.22,.9,.24,1) .05s, opacity .4s ease .55s;
    overflow:hidden;
  }
  .env-letter::before{
    content:""; position:absolute; inset:0;
    background:
      repeating-linear-gradient(0deg, transparent 0 23px, rgba(160,130,80,.10) 23px 24px);
    opacity:.7;
  }
  .env-preview{
    position:absolute; left:0; right:0; top:16%; text-align:center;
    font-family:var(--hand); color:#b08a4e; font-size:clamp(13px,3.6vw,17px);
    letter-spacing:.22em; opacity:.65;
  }

  .env-front{
    z-index:3; border-radius:12px;
    background:linear-gradient(160deg, #f6e6c8 0%, #e9d3ac 55%, #d9bf94 100%);
    clip-path:polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.5);
  }

  .env-flap{
    z-index:5; height:58%; transform-origin:top center;
    background:linear-gradient(180deg, #efdcbb 0%, #e2caa3 62%, #d4b88c 100%);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    transition:transform .95s cubic-bezier(.3,.9,.2,1), z-index 0s linear .45s;
    filter:drop-shadow(0 2px 3px rgba(120,85,40,.22));
  }
  .envelope.is-open .env-flap{ transform:rotateX(-172deg); z-index:1; opacity:0; transition:transform .95s cubic-bezier(.3,.9,.2,1), opacity .45s ease .45s, z-index 0s linear .45s; }
  .envelope.is-open .env-letter{ transform:translateY(-34%); opacity:0; }
  .envelope.is-open{ animation:none; }

  .seal{
    position:absolute; z-index:6; left:50%; top:56%;
    width:clamp(50px, 14vw, 66px); aspect-ratio:1; transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle at 34% 28%, #c94f63, var(--seal) 58%, #7d2135 100%);
    box-shadow:0 6px 14px rgba(90,10,30,.45), inset 0 0 0 2px rgba(255,255,255,.14), inset 0 -4px 10px rgba(60,0,15,.35);
    display:grid; place-items:center;
    color:#f6d9c9; font-size:clamp(20px,5.6vw,26px); line-height:1;
    transition:transform .5s cubic-bezier(.3,.9,.2,1), opacity .4s ease;
  }
  .seal::before{
    content:""; position:absolute; inset:5px; border-radius:50%;
    border:1px dashed rgba(255,225,210,.45);
  }
  .envelope.is-open .seal{ transform:translate(-50%,-50%) scale(.6) rotate(-18deg); opacity:0; }

  .hint{
    margin:0; font-size:.8rem; letter-spacing:.26em; color:rgba(240,222,190,.62);
    animation:breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{ opacity:.45 } 50%{ opacity:.95 } }

  /* ================= 卡片 ================= */
  .card{
    position:relative;
    width:100%; max-width:440px;
    min-width:0;
    max-height:min(820px, calc(100vh - 44px));
    max-height:min(820px, calc(100svh - 44px));
    border-radius:20px;
    background:
      radial-gradient(120% 80% at 50% 0%, #fffdf4 0%, var(--paper) 45%, var(--paper-2) 100%);
    color:var(--ink);
    box-shadow:
      0 30px 70px rgba(0,0,0,.55),
      0 2px 0 rgba(255,255,255,.6) inset,
      0 0 0 1px rgba(190,155,95,.35);
    opacity:0; transform:translateY(26px) scale(.965);
    pointer-events:none;
    transition:opacity .7s ease .18s, transform .9s cubic-bezier(.2,.85,.2,1) .18s;
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  .card.is-in{ opacity:1; transform:none; pointer-events:auto; }
  .card::before{
    content:""; position:absolute; inset:9px; border-radius:13px;
    border:1px solid rgba(186,150,88,.30); pointer-events:none; z-index:3;
  }

  .card-scroll{
    padding:clamp(26px, 6vw, 34px) clamp(20px, 5.5vw, 28px) 8px;
    overflow-y:auto; overscroll-behavior:contain;
    scrollbar-width:thin; scrollbar-color:rgba(170,135,80,.4) transparent;
  }
  .card-scroll::-webkit-scrollbar{ width:4px; }
  .card-scroll::-webkit-scrollbar-thumb{ background:rgba(170,135,80,.35); border-radius:4px; }

  /* 还有内容时：底部渐隐 + 下滑提示；已经滚动时：顶部渐隐 */
  .card.scrolled .card-scroll{
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 34px);
    mask-image:linear-gradient(to bottom, transparent 0, #000 34px);
  }
  .card.show-more .card-scroll{
    -webkit-mask-image:linear-gradient(to bottom, #000 calc(100% - 46px), transparent 100%);
    mask-image:linear-gradient(to bottom, #000 calc(100% - 46px), transparent 100%);
  }
  .card.scrolled.show-more .card-scroll{
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 34px, #000 calc(100% - 46px), transparent 100%);
    mask-image:linear-gradient(to bottom, transparent 0, #000 34px, #000 calc(100% - 46px), transparent 100%);
  }
  .more-hint{
    position:absolute; left:50%; bottom:62px; transform:translateX(-50%);
    z-index:4; pointer-events:none; opacity:0;
    color:rgba(150,118,68,.8); font-size:.95rem; letter-spacing:.1em;
    transition:opacity .35s ease;
    animation:bob 1.9s ease-in-out infinite;
  }
  .card.show-more .more-hint{ opacity:1; }
  @keyframes bob{
    0%,100%{ transform:translate(-50%,0); }
    50%{ transform:translate(-50%,5px); }
  }
  @media (prefers-reduced-motion:reduce){ .more-hint{ animation:none; } }

  .ornament{
    display:flex; align-items:center; justify-content:center; gap:10px;
    color:var(--gold-deep); font-size:.7rem; letter-spacing:.3em; margin-bottom:14px;
  }
  .ornament::before, .ornament::after{
    content:""; height:1px; width:38px;
    background:linear-gradient(90deg, transparent, rgba(170,135,80,.55), transparent);
  }
  .star{
    cursor:pointer; display:inline-block; font-size:1rem; line-height:1;
    color:var(--gold); transition:transform .4s ease, color .4s ease;
    background:none; border:0; padding:2px;
  }
  .star:hover{ transform:rotate(90deg) scale(1.15); color:#b8862f; }
  .star:focus-visible{ outline:1px dashed var(--gold-deep); outline-offset:3px; border-radius:50%; }

  .eyebrow{
    margin:0 0 10px; text-align:center;
    font-family:var(--serif); font-size:.66rem; letter-spacing:.42em;
    color:var(--gold-deep); text-transform:uppercase;
  }
  .to{
    margin:0 0 4px; text-align:center;
    font-family:var(--hand); font-weight:400;
    font-size:clamp(1.95rem, 7.4vw, 2.55rem); line-height:1.25;
    color:#4a3a22; letter-spacing:.02em;
  }
  .to em{ font-style:normal; color:#8c2f3f; }
  .age{
    display:block; margin:6px 0 0; text-align:center;
    font-family:var(--serif); font-size:.72rem; letter-spacing:.3em; color:var(--ink-soft);
  }

  .rule{
    margin:16px auto 18px; width:64%; height:12px; position:relative; opacity:.75;
  }
  .rule::before{
    content:""; position:absolute; left:0; right:0; top:50%; height:1px;
    background:linear-gradient(90deg, transparent, rgba(170,135,80,.55), transparent);
  }
  .rule::after{
    content:"✦"; position:absolute; left:50%; top:50%; transform:translate(-50%,-52%);
    background:var(--paper); padding:0 9px; color:var(--gold-deep); font-size:.58rem;
  }

  .msg{
    margin:0; color:#4a3a26;
    font-family:var(--hand);
    font-size:1.05rem; line-height:1.96; letter-spacing:.005em;
  }
  .msg p{ margin:0 0 .28em; text-align:justify; text-indent:2em; }
  .msg p.blank{ text-indent:0; height:.9em; }
  .msg .ch{ opacity:0; }
  .card.is-in .msg .ch{
    animation:chIn .55s ease forwards;
    animation-delay:var(--d, 0ms);
  }
  @keyframes chIn{ to{ opacity:1; } }
  .msg .em{ color:#8c2f3f; }

  /* 照片 */
  .photos{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;
    margin:16px 0 4px;
  }
  .photo{
    position:relative; aspect-ratio:1/1; border-radius:12px; overflow:hidden;
    background:linear-gradient(145deg, #f1e2c8, #e6d3b2);
    box-shadow:0 4px 10px rgba(120,90,40,.18), inset 0 0 0 1px rgba(255,255,255,.5);
    background-size:cover; background-position:center;
  }
  .photo.is-empty{
    display:grid; place-items:center; align-content:center; gap:4px;
    border:1px dashed rgba(170,135,80,.45);
    background:linear-gradient(145deg, rgba(246,236,216,.9), rgba(232,216,188,.9));
    color:rgba(140,110,65,.75);
  }
  .photo.is-empty .ic{ font-size:1.05rem; opacity:.85; }
  .photo.is-empty .lb{ font-size:.62rem; letter-spacing:.16em; }
  .photo::after{
    content:""; position:absolute; inset:0;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35); border-radius:12px; pointer-events:none;
  }

  /* 蛋糕 */
  .cake-zone{ display:grid; justify-items:center; gap:6px; margin:16px 0 2px; }
  .cake{
    position:relative; width:168px; height:152px; cursor:pointer;
    transition:transform .3s ease; background:none; border:0; padding:0;
  }
  .cake::after{
    content:""; position:absolute; left:50%; bottom:2px; transform:translateX(-50%);
    width:140px; height:10px; border-radius:50%;
    background:radial-gradient(ellipse, rgba(120,90,45,.20), transparent 72%);
    filter:blur(2px);
  }
  .cake:hover{ transform:translateY(-2px); }
  .cake:focus-visible{ outline:1px dashed var(--gold-deep); outline-offset:6px; border-radius:12px; }
  .plate{
    position:absolute; left:50%; bottom:2px; transform:translateX(-50%);
    width:152px; height:16px; border-radius:50%;
    background:radial-gradient(ellipse at 50% 30%, #fffdf8 0%, #eee1c8 58%, #cbb48f 100%);
    box-shadow:0 6px 13px rgba(120,90,40,.20), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .tier{
    position:absolute; left:50%; transform:translateX(-50%);
    border-radius:4px 4px 3px 3px;
    background:
      linear-gradient(90deg, rgba(168,124,68,.26), transparent 18%, transparent 82%, rgba(168,124,68,.26)),
      linear-gradient(180deg, #f7e1ba 0%, #e8c895 52%, #d5ac76 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.75), inset 0 -4px 7px rgba(140,100,50,.18);
  }
  .tier.b{ bottom:12px; width:120px; height:50px; }
  .tier.t{ bottom:68px; width:88px; height:40px; }
  .cream{
    position:absolute; left:50%; transform:translateX(-50%);
    border-radius:7px;
    background:linear-gradient(180deg, #fffdf8, #f9eedb 78%, #f0e0c4);
    box-shadow:0 3px 5px rgba(135,100,50,.16), inset 0 2px 0 rgba(255,255,255,.9);
  }
  .cream.c1{ bottom:58px; width:124px; height:14px; }
  .cream.c2{ bottom:104px; width:92px; height:12px; border-radius:6px; }
  .candles{
    position:absolute; left:50%; bottom:112px; transform:translateX(-50%);
    display:flex; gap:15px; align-items:flex-end;
  }
  .candle{
    position:relative; width:5px; height:26px; border-radius:2px;
    background:repeating-linear-gradient(180deg, #fdfbf5 0 4px, #e8b4b8 4px 8px);
    box-shadow:0 1px 2px rgba(120,90,40,.25);
  }
  .flame{
    position:absolute; left:50%; top:-14px; width:7px; height:13px; transform:translateX(-50%);
    border-radius:50% 50% 45% 45%;
    background:radial-gradient(circle at 50% 68%, #fffbe0 0%, #ffd27a 42%, #f08a3c 74%, rgba(240,138,60,0) 82%);
    box-shadow:0 0 9px 3px rgba(255,190,100,.55), 0 0 20px 8px rgba(255,150,60,.18);
    animation:flicker 1.5s ease-in-out infinite;
    transform-origin:bottom center;
  }
  .candle:nth-child(2) .flame{ animation-delay:-.4s; }
  .candle:nth-child(3) .flame{ animation-delay:-.8s; }
  @keyframes flicker{
    0%,100%{ transform:translateX(-50%) scale(1) rotate(-2deg); opacity:.95; }
    40%{ transform:translateX(-50%) scale(1.12,.9) rotate(3deg); opacity:1; }
    70%{ transform:translateX(-50%) scale(.92,1.08) rotate(-3deg); opacity:.9; }
  }
  .cake.is-out .flame{ animation:none; opacity:0; transform:translateX(-50%) scale(.2); transition:all .35s ease; }
  .cake.is-out{ cursor:default; }
  .puff{
    position:absolute; left:50%; top:-12px; width:8px; height:8px; border-radius:50%;
    background:radial-gradient(circle, rgba(205,205,210,.9), rgba(205,205,210,0));
    opacity:0; pointer-events:none;
  }
  .cake.is-out .puff{ animation:smoke 1.6s ease-out forwards; }
  .puff:nth-child(2){ animation-delay:.09s; }
  .puff:nth-child(3){ animation-delay:.2s; }
  @keyframes smoke{
    0%{ opacity:.8; transform:translate(-50%,0) scale(.55); }
    100%{ opacity:0; transform:translate(-50%,-40px) scale(2.2); }
  }

  .cake-tip{
    margin:0; font-size:.72rem; letter-spacing:.18em; color:var(--ink-soft);
    transition:color .4s ease, opacity .4s ease;
  }
  .cake-tip.done{ color:#8c2f3f; }

  .sign{
    margin:18px 0 4px; text-align:right;
    font-family:var(--hand); font-size:1.28rem; color:#5a4426; letter-spacing:.04em;
  }
  .sign small{ font-family:var(--sans); font-size:.68rem; letter-spacing:.16em; color:var(--ink-soft); }

  .secret{
    margin:16px 0 0; padding:14px 16px; border-radius:10px;
    background:rgba(168,50,74,.06); border:1px dashed rgba(168,50,74,.32);
    font-size:.86rem; line-height:1.9; color:#6b3a41;
    max-height:0; opacity:0; overflow:hidden; padding-top:0; padding-bottom:0;
    transition:max-height .55s ease, opacity .45s ease, padding .45s ease;
  }
  .secret.on{ max-height:220px; opacity:1; padding-top:14px; padding-bottom:14px; }

  .card-foot{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:12px 18px 16px; border-top:1px solid rgba(186,150,88,.22);
    background:linear-gradient(180deg, rgba(253,247,234,.4), rgba(246,236,216,.9));
    flex-wrap:wrap;
  }
  .btn{
    appearance:none; border:1px solid rgba(170,135,80,.45); background:transparent;
    color:#6b5327; font-size:.74rem; letter-spacing:.14em; padding:8px 14px;
    border-radius:999px; cursor:pointer; font-family:var(--sans);
    transition:background .3s, color .3s, border-color .3s, transform .2s;
  }
  .btn:hover{ background:rgba(170,135,80,.12); }
  .btn:active{ transform:scale(.97); }
  .btn:focus-visible{ outline:2px solid rgba(170,135,80,.7); outline-offset:2px; }
  .btn[hidden]{ display:none; }

  .noscript{
    position:fixed; inset:auto 0 0 0; z-index:9; padding:16px; text-align:center;
    background:#0b1020; color:#f4ead6; font-size:.85rem;
  }

  @media (max-width:380px){
    .photos{ gap:6px; }
    .cake{ transform:scale(.92); }
  }
  @media (prefers-reduced-motion:reduce){
    .envelope{ animation:none; }
    .hint{ animation:none; opacity:.7; }
    .flame{ animation:none; }
    .card.is-in .msg .ch{ animation-duration:.01s !important; animation-delay:0ms !important; }
    .card{ transition-duration:.2s; }
  }

  /* 静态预览模式（截图 / 调试）：?instant=1 */
  html.is-instant .envelope{ animation:none; }
  html.is-instant .msg .ch{ opacity:1 !important; animation:none !important; }
  html.is-instant .card{ transition:none !important; }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <canvas id="fx2" aria-hidden="true"></canvas>

  <main class="stage">
    <!-- ========== 信封 ========== -->
    <section class="envelope-wrap" id="envelopeWrap">
      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="打开信封，查看生日贺卡">
        <div class="env-back"></div>
        <div class="env-letter">
          <div class="env-preview" id="envPreview">TO YOU</div>
        </div>
        <div class="env-front"></div>
        <div class="env-flap"></div>
        <div class="seal" aria-hidden="true">♥</div>
      </div>
      <p class="hint">轻触信封，拆开祝福</p>
    </section>

    <!-- ========== 卡片 ========== -->
    <section class="card" id="card" aria-hidden="true">
      <div class="card-scroll" id="cardScroll">
        <div class="ornament"><button class="star" id="star" aria-label="还有一个秘密">✦</button></div>
        <p class="eyebrow">Happy Birthday</p>
        <h1 class="to" id="toName">亲爱的朋友</h1>
        <span class="age" id="ageLine" hidden></span>
        <div class="rule" aria-hidden="true"></div>
        <div class="msg" id="msg"></div>
        <div class="photos" id="photos"></div>

        <div class="cake-zone">
          <button class="cake" id="cake" aria-label="吹灭蜡烛许愿">
            <span class="plate"></span>
            <span class="tier b"></span>
            <span class="tier t"></span>
            <span class="cream c1"></span>
            <span class="cream c2"></span>
            <span class="candles">
              <span class="candle"><span class="flame"></span><span class="puff"></span><span class="puff"></span><span class="puff"></span></span>
              <span class="candle"><span class="flame"></span><span class="puff"></span><span class="puff"></span><span class="puff"></span></span>
              <span class="candle"><span class="flame"></span><span class="puff"></span><span class="puff"></span><span class="puff"></span></span>
            </span>
          </button>
          <p class="cake-tip" id="cakeTip">点一下蛋糕，吹蜡烛许愿</p>
        </div>

        <p class="sign">—— <span id="fromName">我</span></p>
        <p class="secret" id="secret"></p>
      </div>
      <div class="more-hint" id="moreHint" aria-hidden="true">⌄</div>

      <div class="card-foot">
        <button class="btn" id="musicBtn" hidden>♪ 音 乐</button>
        <button class="btn" id="replayBtn">↺ 重 看 一 遍</button>
      </div>
    </section>
  </main>

  <audio id="bgm" loop preload="none"></audio>
  <noscript><div class="noscript">这张贺卡需要开启 JavaScript 才能拆开 :)</div></noscript>

<script>
/* =====================================================================
   ①  只需要改这里 —— 你的素材
   ===================================================================== */
const CONFIG = {
  to: "亲爱的田玲",          // 收件人：名字 / 昵称，例如 "小林"
  from: "李佳琪",                // 署名：例如 "阿哲"
  age: "22",                   // 可选：年龄数字，留空不显示
  message: [                 // 留言，一句一个数组元素；想空行就写 ""
    
    " 今年你22岁生日，我还是没能在你身边。我们从初中认识到现在，都大三了。你在新疆，我在甘肃，每次你过生日我都特别遗憾，自己还是缺席。",
    " 这学期真的过得挺糟糕的，我整个人状态都一般，没有以前那么有精力了，什么都不想干。我本来想像程晨一样，亲手给你做礼物，或者像以前一样，专门给你准备很特别的东西。但这次被时间推着走，没来得及，你不要失望好不好。",
    " 以前给你写信，我总写我们怎么认识、我有多感谢你。但这次我想说点别的。我太了解你了，你现在应该也和我一样，每天会焦虑、会迷茫。我们俩真的太像了，心气都很高，总想把路走好，总想未来能变好。但很多时候又特别无力，不知道自己到底在干嘛，也不知道未来到底怎么走。",
    " 我们都太爱给自己压力了，总为一些没必要的事情烦心、内耗。不过我这段时间慢慢想了一下，未来确实要努力，但也不用逼死自己。谁也不知道现在做的到底有没有用，我们不用事事都做到最好，不用一直紧绷着。",
    " 马上大学就要结束了，我们就慢慢走、稳稳走，按自己舒服的节奏来就好。",
    " 看到别人优秀的时候，我想你也会不甘心、会委屈，这些我都懂。但田玲，你千万不要被情绪困住。你真的超级好，你一定会有很好的未来。就算暂时不顺、暂时普通，也一定只是时间还没到而已。现在来说，依旧我的委屈、不开心，还是更倾向于愿意跟你说。也只有你，能像一个姐姐让我完全安心。可是这学期我们都太忙了，联系变少、距离变远，其实我心里一直压着、挺难受的，所以我在这里永远永远期待着和你见面！最后我想认真跟你说：田玲，你一定要好好喜欢自己。",
    " 不管你笨拙一点、迟钝一点、变胖一点、偶尔胆小、失败了、累了、哭了、软弱了、普通平凡，都没关系。你都要接纳自己、善待自己。",
    "生日快乐我的玲儿！"
    
  ],
  photos: [    
    "p1.jpg",
    "p2.jpg" ,
    "p3.jpg"             // 照片：把图片放在同目录，填文件名；留空 [] 显示占位框
    // "photo1.jpg", "photo2.jpg", "photo3.jpg"
  ],
  music: "music.mp3",                 // 背景音乐：例如 "music.mp3"，留空则不显示音乐按钮
  secret: "永远幸福很难，所以我祝你每天都能睡个好觉！",
  sealChar: "♥"              // 火漆印上的字，可换成 "寿" 或对方姓氏
};

/* =====================================================================
   ②  以下不用改
   ===================================================================== */
(function () {
  "use strict";

  /* ---- URL 参数：?to=小林&from=阿哲&stage=card ---- */
  const qs = new URLSearchParams(location.search);
  if (qs.get("to")) CONFIG.to = qs.get("to");
  if (qs.get("from")) CONFIG.from = qs.get("from");
  const stageParam = qs.get("stage");
  const autoOpen = stageParam === "card" || stageParam === "wish";
  const staticMode = qs.get("instant") === "1" || autoOpen;
  CONFIG.__instant = autoOpen;
  if (staticMode) document.documentElement.classList.add("is-instant");
  const FX_OFF = staticMode && qs.get("fx") !== "1";

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const $ = (id) => document.getElementById(id);
  const envelope = $("envelope"), envelopeWrap = $("envelopeWrap"), card = $("card");
  const msgEl = $("msg"), photosEl = $("photos"), cake = $("cake"), cakeTip = $("cakeTip");
  const secretEl = $("secret"), bgm = $("bgm"), musicBtn = $("musicBtn");

  /* ---- 文案 ---- */
  document.title = "生日快乐 · " + CONFIG.to;
  $("toName").innerHTML = escapeHTML(CONFIG.to);
  $("fromName").textContent = CONFIG.from;
  $("envPreview").textContent = "TO " + (CONFIG.to || "YOU").toUpperCase();
  document.querySelector(".seal").textContent = CONFIG.sealChar || "♥";
  secretEl.textContent = CONFIG.secret || "";
  $("star").hidden = !CONFIG.secret;

  if (CONFIG.age) {
    const ageLine = $("ageLine");
    ageLine.textContent = "TURNING " + CONFIG.age;
    ageLine.hidden = false;
  }

  /* ---- 留言：逐字构建（自动去掉手打的前导空格，交给 CSS 首行缩进） ---- */
  const charSpans = [];
  const lines = CONFIG.message.map((l) => String(l == null ? "" : l).replace(/^\s+/, "").trimEnd());
  const totalChars = lines.reduce((n, l) => n + [...l].length, 0);
  // 长信整体控制在 ~1.8s 内写完，短信保持每字 28ms 的节奏
  const step = Math.max(2, Math.min(28, 1800 / Math.max(1, totalChars)));
  let charIndex = 0;
  lines.forEach((line) => {
    const p = document.createElement("p");
    if (!line) { p.className = "blank"; p.innerHTML = "<br>"; msgEl.appendChild(p); return; }
    [...line].forEach((ch) => {
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = ch;
      s.style.setProperty("--d", Math.round(charIndex * step) + "ms");
      charIndex++;
      charSpans.push(s);
      p.appendChild(s);
    });
    msgEl.appendChild(p);
  });

  /* ---- 照片 ---- */
  for (let i = 0; i < 3; i++) {
    const d = document.createElement("div");
    d.className = "photo";
    const src = CONFIG.photos[i];
    if (src) {
      d.style.backgroundImage = 'url("' + String(src).replace(/"/g, "%22") + '")';
      d.setAttribute("role", "img");
      d.setAttribute("aria-label", "照片 " + (i + 1));
    } else {
      d.classList.add("is-empty");
      d.innerHTML = '<span class="ic" aria-hidden="true">✿</span><span class="lb">照片</span>';
    }
    photosEl.appendChild(d);
  }

  /* ---- 音乐 ---- */
  let musicOn = false;
  if (CONFIG.music) {
    bgm.src = CONFIG.music;
    musicBtn.hidden = false;
    musicBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (musicOn) { bgm.pause(); musicOn = false; musicBtn.textContent = "♪ 音 乐"; }
      else {
        bgm.play().then(() => { musicOn = true; musicBtn.textContent = "❚❚ 暂 停"; }).catch(() => {});
      }
    });
  }

  /* ---- 长信：底部渐隐 + 下滑提示 ---- */
  const scroller = document.querySelector(".card-scroll");
  function updateScrollHint() {
    const more = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight > 6;
    const scrolled = scroller.scrollTop > 6;
    card.classList.toggle("show-more", more);
    card.classList.toggle("scrolled", scrolled);
  }
  scroller.addEventListener("scroll", updateScrollHint, { passive: true });
  window.addEventListener("resize", () => setTimeout(updateScrollHint, 150), { passive: true });

  /* ---- 打开 ---- */
  let opened = false;
  function openCard() {
    if (opened) return;
    opened = true;
    document.body.classList.add("is-open");
    envelope.classList.add("is-open");
    envelope.setAttribute("aria-expanded", "true");

    const t2 = CONFIG.__instant ? 0 : 1180;

    setTimeout(() => {
      envelopeWrap.classList.add("gone");
      card.classList.add("is-in");
      card.setAttribute("aria-hidden", "false");
      card.setAttribute("tabindex", "-1");
      card.focus({ preventScroll: true });
      startDust();
      setTimeout(updateScrollHint, 80);
      setTimeout(() => {
        burst(window.innerWidth / 2, window.innerHeight * 0.46, 72);
      }, CONFIG.__instant ? 0 : 320);
    }, t2);

    setTimeout(() => { envelopeWrap.style.display = "none"; }, t2 + 700);

    if (CONFIG.music) {
      const p = bgm.play();
      if (p && p.then) p.then(() => { musicOn = true; musicBtn.textContent = "❚❚ 暂 停"; }).catch(() => {});
    }
  }

  envelope.addEventListener("click", openCard);
  envelope.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCard(); }
  });

  /* ---- 蛋糕 ---- */
  cake.addEventListener("click", () => {
    if (cake.classList.contains("is-out")) return;
    cake.classList.add("is-out");
    const r = cake.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + 20, 60);
    setTimeout(() => {
      cakeTip.textContent = "愿望已经许下 ✨";
      cakeTip.classList.add("done");
    }, 240);
  });

  /* ---- 彩蛋 ---- */
  $("star").addEventListener("click", (e) => {
    e.stopPropagation();
    secretEl.classList.toggle("on");
    if (secretEl.classList.contains("on")) {
      setTimeout(() => { card.querySelector(".card-scroll").scrollTo({ top: 9999, behavior: "smooth" }); }, 260);
    }
  });

  /* ---- 重看 ---- */
  $("replayBtn").addEventListener("click", () => {
    location.href = location.pathname;
  });

  /* ================= 画布：星尘（卡片后） + 彩带（卡片上） ================= */
  const dustCvs = $("fx"), dustCtx = dustCvs.getContext("2d");
  const confCvs = $("fx2"), confCtx = confCvs.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    [[dustCvs, dustCtx], [confCvs, confCtx]].forEach(function (pair) {
      pair[0].width = Math.floor(W * DPR);
      pair[0].height = Math.floor(H * DPR);
      pair[1].setTransform(DPR, 0, 0, DPR, 0, 0);
    });
  }
  resize();
  window.addEventListener("resize", resize, { passive: true });

  const dust = [];
  const confetti = [];
  let dustStarted = false, raf = null, running = false;

  function startDust() {
    if (dustStarted || reduce || FX_OFF) return;
    dustStarted = true;
    const n = Math.round(Math.min(46, W / 12));
    for (let i = 0; i < n; i++) {
      dust.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.7 + 0.5,
        vy: -(Math.random() * 0.22 + 0.05),
        vx: (Math.random() - 0.5) * 0.12,
        a: Math.random() * 0.5 + 0.15,
        ph: Math.random() * Math.PI * 2
      });
    }
    schedule();
  }

  const COLORS = ["#e9cd97", "#d8b26a", "#f3e2c0", "#c25565", "#8fa6d8", "#f6f1e6"];

  function burst(x, y, count) {
    if (reduce || FX_OFF || !count) return;
    for (let i = 0; i < count; i++) {
      const ang = (-Math.PI / 2) + (Math.random() - 0.5) * 2.2;
      const sp = Math.random() * 8.5 + 3.5;
      confetti.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp * (0.55 + Math.random() * 0.8),
        vy: Math.sin(ang) * sp,
        w: Math.random() * 6 + 4, h: Math.random() * 10 + 5,
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.28,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        life: 1
      });
    }
    if (!dustStarted) startDust(); else schedule();
  }

  function draw() {
    dustCtx.clearRect(0, 0, W, H);

    for (const p of dust) {
      p.ph += 0.012;
      p.x += p.vx; p.y += p.vy;
      if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
      if (p.x < -10) p.x = W + 10;
      if (p.x > W + 10) p.x = -10;
      const a = p.a * (0.6 + 0.4 * Math.sin(p.ph));
      dustCtx.beginPath();
      dustCtx.fillStyle = "rgba(233,205,151," + a.toFixed(3) + ")";
      dustCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      dustCtx.fill();
    }

    confCtx.clearRect(0, 0, W, H);

    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.vy += 0.16;
      c.vx *= 0.995;
      c.x += c.vx; c.y += c.vy;
      c.rot += c.vr;
      c.life -= 0.004;

      if (c.y > H + 40 || c.life <= 0) { confetti.splice(i, 1); continue; }

      confCtx.save();
      confCtx.translate(c.x, c.y);
      confCtx.rotate(c.rot);
      confCtx.globalAlpha = Math.max(0, Math.min(1, c.life));
      confCtx.fillStyle = c.c;
      confCtx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h * (0.6 + 0.4 * Math.abs(Math.cos(c.rot))));
      confCtx.restore();
    }

    if (confetti.length === 0 && !dustStarted) { running = false; raf = null; return; }
    raf = requestAnimationFrame(draw);
  }

  function schedule() {
    if (running || reduce) return;
    running = true;
    raf = requestAnimationFrame(draw);
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = null; running = false; }
    else if (dustStarted) schedule();
  });

  /* ---- 工具 ---- */
  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  /* ---- 预览模式：?stage=card 直接看卡片 / ?stage=wish 直接看吹蜡烛效果 ---- */
  if (CONFIG.__instant) {
    card.style.transition = "none";
    document.querySelectorAll(".envelope-wrap, .env-letter").forEach((n) => (n.style.transition = "none"));
    openCard();
    if (qs.get("stage") === "wish") setTimeout(() => cake.click(), 60);
  } else {
    // 兜底：若动画被中断，也给一个极轻的星尘
    window.addEventListener("load", () => { if (!reduce) { startDust(); } }, { once: true });
  }
})();
</script>
